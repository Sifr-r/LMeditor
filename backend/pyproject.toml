[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmeditor"
version = "0.1.0"
description = "Enterprise-grade LLM writing harness anchored strictly to verifiable source passages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "dspy-ai",
    "langgraph",
    "llama-index",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "numpy",
    # Source ingestion (Task 7)
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "markdownify>=0.11.0",
    "trafilatura>=1.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lmeditor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "dspy.*",
    "langgraph.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "lmeditor.drafting.signatures",
    "lmeditor.drafting.modules",
    "lmeditor.discovery.perspective",
]
disallow_subclassing_any = false
