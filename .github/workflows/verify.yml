name: Verify candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked project and development dependencies
        working-directory: backend
        run: uv sync --locked --extra dev --python 3.13
      - name: Verify fresh Kotlin source and backend
        working-directory: backend
        run: uv run --locked --extra dev python scripts/verify_release.py --portable
      - name: Retain verification logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            build/release/run-*/*.log
            build/release/run-*/external-checks.json
            build/release/run-*/platform-checks.json
            build/release/run-*/pytest.xml
            build/release/run-*/kotlin-junit/**/*.xml
            kotlin/*/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
